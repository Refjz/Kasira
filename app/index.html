<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Kasira POS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: app shell, sidebar of role-based menu + work area; kasir screen splits product grid and cart. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E8EEEA; --ink:#14201B; --muted:#5B6A62; --line:#D6DED9;
  --accent:#0C7A62; --accent-ink:#FFFFFF; --accent-soft:#DCEFE8; --gold:#C98A0C; --gold-soft:#FBF0D6;
  --ok:#1C8A4B; --warn:#B7700A; --bad:#C2372F; --bad-soft:#F9E1DF;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1B; --surface-2:#1E2925; --ink:#E4ECE7; --muted:#93A39A; --line:#29362F;
  --accent:#38C29D; --accent-ink:#06261D; --accent-soft:#163A30; --gold:#EDB743; --gold-soft:#3A2F12;
  --ok:#4FCB83; --warn:#E9A93B; --bad:#F06A60; --bad-soft:#3C1C1A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1B; --surface-2:#1E2925; --ink:#E4ECE7; --muted:#93A39A; --line:#29362F;
  --accent:#38C29D; --accent-ink:#06261D; --accent-soft:#163A30; --gold:#EDB743; --gold-soft:#3A2F12;
  --ok:#4FCB83; --warn:#E9A93B; --bad:#F06A60; --bad-soft:#3C1C1A; color-scheme:dark;}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.7rem;font-weight:800}
h2{font-size:1.2rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);padding:.55rem .95rem;border-radius:8px;font-weight:600;display:inline-flex;align-items:center;gap:.4rem;justify-content:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:.3rem .6rem;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.55rem .7rem}
.field{display:grid;gap:.3rem}
.field label{font-size:.85rem;font-weight:600}
.pill{display:inline-block;padding:.12rem .55rem;border-radius:99px;font-size:.75rem;font-weight:700;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--accent-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem}
.stack{display:grid;gap:1rem;align-content:start}
.stack>*,.main-inner>*{min-width:0}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding-block:2rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:100%;max-width:880px;display:grid;grid-template-columns:1.1fr 1fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.login-hero{background:var(--accent);color:var(--accent-ink);padding:2rem;display:grid;align-content:space-between;gap:2rem}
.login-hero h1{font-size:2.6rem}
.login-hero ul{margin:0;padding-left:1.1rem;display:grid;gap:.35rem}
.login-side{padding:1.6rem;display:grid;gap:1rem;align-content:start}
.acct{display:grid;grid-template-columns:auto 1fr auto;gap:.75rem;align-items:center;text-align:left;width:100%;padding:.7rem .8rem;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.acct:hover{border-color:var(--accent);background:var(--accent-soft)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--surface-2);font-size:.85rem;flex:none}
.tier{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (max-width:760px){.login-card{grid-template-columns:1fr}.login-hero h1{font-size:2rem}}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:1.1rem .8rem;display:flex;flex-direction:column;gap:1rem;position:sticky;top:0;height:100vh}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.35rem;padding:0 .4rem;display:flex;align-items:center;gap:.45rem}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;inset:6px 5px;border-top:3px solid var(--accent-ink);border-bottom:3px solid var(--accent-ink)}
.tenant-chip{padding:.55rem .6rem;border-radius:8px;background:var(--surface-2)}
.nav{display:grid;gap:.15rem}
.nav button{text-align:left;border:0;background:none;padding:.55rem .65rem;border-radius:8px;font-weight:600;color:var(--muted)}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.side-foot{margin-top:auto;display:grid;gap:.5rem}
.main{min-width:0;padding-block:1.4rem 2rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main-inner{max-width:1180px;margin:0 auto;display:grid;gap:1.2rem}
@media (min-width:900px){.main{padding-left:2rem;padding-right:2rem}}
@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:5;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:.6rem max(16px,env(safe-area-inset-right,0px)) .6rem max(16px,env(safe-area-inset-left,0px));gap:.5rem}
  .tenant-chip{display:none}
  .nav{grid-auto-flow:column;justify-content:start;overflow-x:auto;order:3;width:100%;min-width:0;max-width:100%}
  .nav button{white-space:nowrap}
  .side-foot{margin:0 0 0 auto;grid-auto-flow:column;align-items:center}
  .side-foot .who{display:none}
}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.8rem}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem;display:grid;gap:.25rem}
.tile .v{font-family:var(--f-mono);font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
.tile .d{font-size:.8rem}
.up{color:var(--ok)} .down{color:var(--bad)}
.grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:1rem}
.grid-2>*{min-width:0}
@media (max-width:980px){.grid-2{grid-template-columns:1fr}}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;font-weight:600;padding:.5rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.6rem;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.chart .bar{fill:var(--accent)}
.chart .bar.today{fill:var(--gold)}
.chart .grid{stroke:var(--line)}

/* POS */
.pos{display:grid;grid-template-columns:1fr 360px;gap:1rem;align-items:start}
.pos>*{min-width:0}
.cats{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.2rem}
.cats button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:.35rem .85rem;font-weight:600;white-space:nowrap}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem}
.prod{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:.75rem;text-align:left;display:grid;gap:.35rem;position:relative}
.prod:hover{border-color:var(--accent)}
.prod .sw{height:54px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.prod .nm{font-weight:600;line-height:1.25}
.prod .pr{font-family:var(--f-mono);font-weight:700;font-size:.9rem}
.prod .st{font-size:.75rem}
.prod.out{opacity:.45;cursor:not-allowed}
.prod .q{position:absolute;top:.45rem;right:.45rem;background:var(--accent);color:var(--accent-ink);border-radius:99px;min-width:24px;height:24px;display:grid;place-items:center;font-size:.8rem;font-weight:700;padding:0 .35rem}
.cart{position:sticky;top:1rem;display:grid;gap:.8rem}
.cart-lines{display:grid;gap:.5rem;max-height:42vh;overflow:auto}
.line{display:grid;grid-template-columns:1fr auto;gap:.2rem .6rem;padding:.55rem 0;border-bottom:1px dashed var(--line)}
.qty{display:inline-flex;justify-self:start;align-items:center;border:1px solid var(--line);border-radius:8px}
.qty button{border:0;background:none;width:30px;height:28px;font-weight:700}
.qty span{min-width:26px;text-align:center;font-family:var(--f-mono)}
.sum{display:grid;gap:.3rem;font-size:.92rem}
.sum div{display:flex;justify-content:space-between}
.sum .total{font-size:1.25rem;font-weight:700;padding-top:.4rem;border-top:1px solid var(--line)}
.sum .total .num{color:var(--gold)}
@media (max-width:1050px){.pos{grid-template-columns:1fr}.cart{position:static}}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(5,12,9,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:14px;border:1px solid var(--line);width:100%;max-width:480px;max-height:90vh;overflow:auto;padding:1.3rem;display:grid;gap:1rem}
.methods{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem}
.methods button{border:1px solid var(--line);background:var(--surface);padding:.65rem;border-radius:8px;font-weight:600}
.methods button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.receipt{font-family:var(--f-mono);font-size:.82rem;background:var(--surface-2);border-radius:8px;padding:1rem;white-space:pre-wrap;line-height:1.55;overflow-x:auto}
.qris{display:grid;place-items:center;gap:.4rem;padding:.8rem;background:var(--surface-2);border-radius:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:8px;font-weight:600;z-index:60}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem}
.plan{display:grid;gap:.6rem;align-content:start}
.plan ul{margin:0;padding-left:1.1rem;display:grid;gap:.2rem;font-size:.9rem}
.plan.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.bar-meter{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.bar-meter i{display:block;height:100%;background:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:.35rem}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.4rem .7rem;font-weight:600;font-size:.88rem}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.linkish{border:0;background:none;padding:0;color:var(--accent);font-family:var(--f-mono);font-size:inherit;text-decoration:underline;cursor:pointer}
.scan{display:grid;gap:.35rem}
.kboard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;align-items:start}
@media (max-width:900px){.kboard{grid-template-columns:1fr}}
.kcol{display:grid;gap:.6rem;align-content:start}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.9rem;display:grid;gap:.5rem}
.kcard.late{border-color:var(--bad)}
.kcard ul{margin:0;padding-left:1.1rem;display:grid;gap:.15rem}
.empty{grid-column:1/-1;padding:2rem;text-align:center;color:var(--muted)}
.blocked{max-width:520px;margin:3rem auto;text-align:center;display:grid;gap:.8rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="root"></div>

<script>
(function(){
"use strict";
const KEY = "kasira-demo-v2";
const isFnb = t => t && t.type==="F&B";
const isRetail = t => t && (t.type==="Minimarket" || t.type==="Retail");
const ORDER_TYPES = ["Makan di sini","Bawa pulang","Ojol"];

  gratis:{name:"Gratis",price:0,staff:2,products:50,outlets:1,feat:["1 outlet","Maks. 2 staf","Maks. 50 produk","Laporan harian"]},

  bisnis:{name:"Bisnis",price:249000,staff:Infinity,products:Infinity,outlets:Infinity,feat:["Outlet tak terbatas","Staf tak terbatas","Stok antar-outlet","Akses API & integrasi","Prioritas dukungan"]}
};
const ROLE = {superadmin:"Pemilik Aplikasi",owner:"Pemilik Usaha",manager:"Manajer",cashier:"Kasir"};
const MENU = {
  superadmin:[["platform","Ringkasan Platform"],["tenants","Pelanggan"],["plans","Paket Langganan"]],
  owner:[["dash","Dasbor"],["pos","Kasir"],["products","Produk & Stok"],["trx","Transaksi"],["staff","Staf"],["billing","Langganan"]],
  manager:[["dash","Dasbor"],["pos","Kasir"],["products","Produk & Stok"],["trx","Transaksi"]],
  cashier:[["pos","Kasir"],["trx","Transaksi Saya"]]
};
function menuFor(u,t){
  const m = MENU[u.role].slice();
  if(isFnb(t) && u.role!=="superadmin") m.splice(m.findIndex(x=>x[0]==="pos")+1,0,["kitchen","Dapur"]);
  return m;
}
const DAY = 86400000;
const daysTo = ts => Math.ceil((ts - Date.now())/DAY);
const modsText = m => m ? Object.entries(m).filter(([k,v])=>v).map(([k,v])=>k+": "+v).join(", ") : "";
const rp = n => "Rp" + Math.round(n).toLocaleString("id-ID");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Math.random().toString(36).slice(2,8);
const initials = s => s.split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const dayKey = t => { const d=new Date(t); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); };
const HUES = ["#0C7A62","#C98A0C","#7A4FB5","#C2372F","#2F6FB7","#5E8C1E","#B5507A","#1B8A99"];
function swatch(name){ let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))>>>0; return HUES[h%HUES.length]; }

function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function seed(){
  const r = rng(42);
  const now = Date.now();
  const tenants = [
    {id:"t1",name:"Kopi Senja",type:"F&B",plan:"pro",status:"aktif",tax:10,joined:now-86400000*120,city:"Bandung"},
    {id:"t2",name:"Toko Berkah Jaya",type:"Minimarket",plan:"bisnis",status:"aktif",tax:0,joined:now-86400000*300,city:"Surabaya"},
    {id:"t3",name:"Bakso Pak Kumis",type:"F&B",plan:"gratis",status:"aktif",tax:10,joined:now-86400000*20,city:"Solo"},
    {id:"t4",name:"Laundry Wangi",type:"Jasa",plan:"pro",status:"ditangguhkan",tax:0,joined:now-86400000*200,city:"Depok"}
  ];
  const users = [
    {id:"u0",name:"Rian Hadi",email:"admin@kasira.id",role:"superadmin",tenantId:null},
    {id:"u1",name:"Sinta Maharani",email:"sinta@kopisenja.id",role:"owner",tenantId:"t1"},
    {id:"u2",name:"Dimas Pratama",email:"dimas@kopisenja.id",role:"manager",tenantId:"t1"},
    {id:"u3",name:"Ayu Lestari",email:"ayu@kopisenja.id",role:"cashier",tenantId:"t1"},
    {id:"u4",name:"Bayu Saputra",email:"bayu@kopisenja.id",role:"cashier",tenantId:"t1"},
    {id:"u5",name:"Hendra Wijaya",email:"hendra@berkahjaya.id",role:"owner",tenantId:"t2"},
    {id:"u6",name:"Rina Kartika",email:"rina@berkahjaya.id",role:"cashier",tenantId:"t2"},
    {id:"u7",name:"Pak Kumis",email:"kumis@baksopk.id",role:"owner",tenantId:"t3"},
    {id:"u8",name:"Wulan Sari",email:"wulan@laundrywangi.id",role:"owner",tenantId:"t4"}
  ];
  const P = (t,name,cat,price,cost,stock,extra)=>({id:uid("p"),tenantId:t,name,cat,price,cost,stock,...(extra||{})});
  const DRINK = [{name:"Gula",opts:["Normal","Less","Tanpa"]},{name:"Es",opts:["Normal","Sedikit","Panas"]}];
  const HOT = [{name:"Gula",opts:["Normal","Less","Tanpa"]}];
  const SPICY = [{name:"Pedas",opts:["Tidak","Sedang","Pedas"]},{name:"Telur",opts:["Dadar","Ceplok"]}];
  const exp = d => now + d*DAY;
  const products = [
    P("t1","Es Kopi Susu Aren","Kopi",22000,8000,80,{mods:DRINK}),P("t1","Americano","Kopi",20000,6000,90,{mods:DRINK}),P("t1","Cappuccino","Kopi",26000,9000,60,{mods:DRINK}),
    P("t1","Kopi Tubruk","Kopi",15000,4000,8,{mods:HOT}),P("t1","Matcha Latte","Non-Kopi",28000,11000,40,{mods:DRINK}),P("t1","Cokelat Panas","Non-Kopi",24000,9000,35,{mods:HOT}),
    P("t1","Teh Tarik","Non-Kopi",18000,5000,6,{mods:DRINK}),P("t1","Croissant Mentega","Makanan",25000,12000,20),P("t1","Pisang Goreng Keju","Makanan",20000,7000,30),
    P("t1","Roti Bakar Srikaya","Makanan",22000,8000,0),P("t1","Nasi Goreng Kampung","Makanan",35000,15000,25,{mods:SPICY}),P("t1","Kentang Goreng","Makanan",23000,8000,45),
    P("t2","Beras Premium 5 kg","Sembako",78000,68000,40,{sku:"8992761100015",exp:exp(240),whole:{min:5,price:76000}}),P("t2","Minyak Goreng 2 L","Sembako",36000,31000,55,{sku:"8993496110027",exp:exp(180),whole:{min:6,price:35000}}),
    P("t2","Gula Pasir 1 kg","Sembako",17500,15000,9,{sku:"8997035600034",exp:exp(300),whole:{min:5,price:16800}}),P("t2","Telur Ayam 1 kg","Sembako",29000,25000,30,{sku:"2000000000041",exp:exp(9)}),
    P("t2","Susu UHT 1 L","Minuman",19500,16000,24,{sku:"8992753100058",exp:exp(21)}),P("t2","Roti Tawar","Roti",16000,12500,12,{sku:"8996001300065",exp:exp(3)}),
    P("t2","Sabun Mandi","Kebersihan",4500,3200,120,{sku:"8999999100072",exp:exp(700),whole:{min:12,price:4100}}),P("t2","Mi Instan Goreng","Makanan",3500,2800,300,{sku:"0089686010089",exp:exp(150),whole:{min:10,price:3200}}),
    P("t2","Air Mineral 600 ml","Minuman",4000,2500,200,{sku:"8886008101096",exp:exp(365),whole:{min:24,price:3500}}),
    P("t3","Bakso Urat","Bakso",18000,8000,60),P("t3","Bakso Telur","Bakso",20000,9000,40),P("t3","Mi Ayam","Mi",15000,6000,50),P("t3","Es Jeruk","Minuman",6000,2000,80),
    P("t4","Cuci Kering per kg","Kiloan",7000,2500,999),P("t4","Cuci Setrika per kg","Kiloan",10000,3500,999),P("t4","Bed Cover","Satuan",35000,12000,999)
  ];
  const transactions = [];
  const methods = ["Tunai","QRIS","QRIS","Kartu Debit","Tunai","QRIS"];
  const cashiers = {t1:["u3","u4","u2"],t2:["u6","u5"],t3:["u7"],t4:["u8"]};
  for(const t of tenants){
    const tp = products.filter(p=>p.tenantId===t.id);
    const volume = {t1:16,t2:22,t3:9,t4:4}[t.id];
    for(let d=6; d>=0; d--){
      const n = Math.round(volume*(0.7+r()*0.6) * (d===0?0.6:1));
      for(let i=0;i<n;i++){
        const hour = [8,9,10,12,12,13,13,15,16,17,19,19,20][Math.floor(r()*13)];
        const base = new Date(now - d*86400000); base.setHours(hour, Math.floor(r()*60), 0, 0);
        if(base.getTime()>now) base.setTime(now - Math.floor(r()*3600000));
        const items=[]; const k=1+Math.floor(r()*3);
        for(let j=0;j<k;j++){ const p=tp[Math.floor(r()*tp.length)]; const ex=items.find(x=>x.pid===p.id); if(ex) ex.qty++; else items.push({pid:p.id,name:p.name,qty:1+Math.floor(r()*2),price:p.price,cost:p.cost}); }
        const tx = makeTrx(t, items, 0, methods[Math.floor(r()*methods.length)], cashiers[t.id][Math.floor(r()*cashiers[t.id].length)], base.getTime());
        if(isFnb(t)){ tx.orderType = ORDER_TYPES[Math.floor(r()*3)]; if(tx.orderType==="Makan di sini") tx.table = String(1+Math.floor(r()*12)); tx.kitchen="selesai"; }
        transactions.push(tx);
      }
    }
  }
  transactions.sort((a,b)=>b.time-a.time);
  const open = transactions.filter(x=>x.tenantId==="t1").slice(0,4);
  ["baru","baru","proses","siap"].forEach((k,i)=>{ if(open[i]){ open[i].kitchen=k; open[i].time=now-(i*4+2)*60000; } });
  for(const x of open){ for(const it of x.items){ const p=products.find(p=>p.id===it.pid); if(p&&p.mods&&r()>.3) it.mods=Object.fromEntries(p.mods.map(m=>[m.name,m.opts[Math.floor(r()*m.opts.length)]])); } }
  return {tenants,users,products,transactions,seq:1000};
}
function makeTrx(t, items, discPct, method, cashierId, time){
  const subtotal = items.reduce((s,x)=>s+x.price*x.qty,0);
  const discount = Math.round(subtotal*discPct/100);
  const tax = Math.round((subtotal-discount)*t.tax/100);
  const total = subtotal-discount+tax;
  return {id:"TRX-"+Math.random().toString(36).slice(2,7).toUpperCase(),tenantId:t.id,cashierId,time,items,subtotal,discount,tax,total,method,paid:total,change:0};
}

/* ---------- metrics ---------- */
function trxOf(tid){ return db.transactions.filter(x=>x.tenantId===tid); }
function last7(list){
  const days=[]; for(let d=6;d>=0;d--){ const dt=new Date(Date.now()-d*86400000); days.push({key:dayKey(dt),label:dt.toLocaleDateString("id-ID",{weekday:"short"}),v:0}); }
  for(const x of list){ const k=dayKey(x.time); const d=days.find(a=>a.key===k); if(d) d.v+=x.total; }
  return days;
}
function barChart(days){
  const W=640,H=220,L=56,B=28,T=12; const max=Math.max(...days.map(d=>d.v),1);
  const step = niceStep(max/4); const top = Math.ceil(max/step)*step;
  const bw=(W-L-10)/days.length;
  let g=""; for(let v=0; v<=top; v+=step){ const y=T+(H-T-B)*(1-v/top); g+=`<line class="grid" x1="${L}" x2="${W-6}" y1="${y}" y2="${y}"/><text x="${L-8}" y="${y+4}" text-anchor="end">${short(v)}</text>`; }
  const bars = days.map((d,i)=>{ const h=(H-T-B)*(d.v/top); const x=L+i*bw+bw*.18; return `<rect class="bar${i===days.length-1?" today":""}" x="${x}" y="${H-B-h}" width="${bw*.64}" height="${Math.max(h,0)}" rx="4"><title>${d.label}: ${rp(d.v)}</title></rect><text x="${x+bw*.32}" y="${H-8}" text-anchor="middle">${d.label}</text>`; }).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Omzet 7 hari terakhir">${g}${bars}</svg></div>`;
}
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x||1))); const n=x/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function short(v){ return v>=1e6 ? (v/1e6).toLocaleString("id-ID",{maximumFractionDigits:1})+" jt" : v>=1e3 ? Math.round(v/1e3)+" rb" : String(v); }

function cartCalc(t){
  const totalQty = {}; for(const x of ui.cart) totalQty[x.pid]=(totalQty[x.pid]||0)+x.qty;
  const lines = ui.cart.map(x=>{ const p=db.products.find(p=>p.id===x.pid); const ws = p.whole && totalQty[p.id]>=p.whole.min; return {key:x.key,pid:p.id,name:p.name,price:p.price,unit:ws?p.whole.price:p.price,wholesale:!!ws,cost:p.cost,qty:x.qty,mods:x.mods||null}; });
  const subtotal = lines.reduce((s,l)=>s+l.unit*l.qty,0);
  const saved = lines.reduce((s,l)=>s+(l.price-l.unit)*l.qty,0);
  const d = Math.min(Math.max(+ui.disc||0,0),100);
  const discount = Math.round(subtotal*d/100); const tax = Math.round((subtotal-discount)*t.tax/100);
  return {lines,subtotal,saved,discount,tax,total:subtotal-discount+tax};
}
function addToCart(p, mods){
  const have = ui.cart.filter(x=>x.pid===p.id).reduce((s,x)=>s+x.qty,0);
  if(p.stock<999 && have>=p.stock){ toast("Stok "+p.name+" tidak cukup"); return false; }
  const key = p.id + (mods? "|"+JSON.stringify(mods) : "");
  const x = ui.cart.find(x=>x.key===key);
  if(x) x.qty++; else ui.cart.push({key,pid:p.id,qty:1,mods:mods||null});
  return true;
}

  : `<p class="muted">Konfirmasi setelah pembayaran ${pay.method.toLowerCase()} berhasil di mesin EDC atau rekening.</p>`}

function qrSvg(){ const r=rng(7); let s=""; const n=25; for(let y=0;y<n;y++)for(let x=0;x<n;x++){ const f=(x<7&&y<7)||(x>n-8&&y<7)||(x<7&&y>n-8); const on=f?((x%6===0||y%6===0||(x>1&&x<5&&y>1&&y<5))||(x>n-8&&((x-(n-7))%6===0||y%6===0||(x>n-6&&x<n-2&&y>1&&y<5)))||(y>n-8&&(x%6===0||(y-(n-7))%6===0||(x>1&&x<5&&y>n-6&&y<n-2)))):r()>.52; if(on) s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`; } return `<svg viewBox="-2 -2 29 29" width="170" height="170" style="background:#fff;border-radius:6px" aria-label="Kode QRIS contoh"><g fill="#111">${s}</g></svg>`; }
function receiptText(x){
  const t=db.tenants.find(t=>t.id===x.tenantId); const k=db.users.find(u=>u.id===x.cashierId);
  const W=34, pad=(a,b)=>a+" ".repeat(Math.max(1,W-a.length-b.length))+b;
  let s=`${t.name.toUpperCase()}\n${t.city}\n${"-".repeat(W)}\n${x.id}\n${new Date(x.time).toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"})}\nKasir: ${k?k.name:"-"}\n${"-".repeat(W)}\n`;
  if(x.orderType) s+=`${x.orderType}${x.table?" · Meja "+x.table:""}\n${"-".repeat(W)}\n`;
  for(const i of x.items){ s+=`${i.name}${i.mods?"\n  ("+modsText(i.mods)+")":""}\n${pad("  "+i.qty+" x "+i.price.toLocaleString("id-ID"),(i.qty*i.price).toLocaleString("id-ID"))}\n`; }
  s+=`${"-".repeat(W)}\n${pad("Subtotal",x.subtotal.toLocaleString("id-ID"))}\n`;
  if(x.discount) s+=pad("Diskon","-"+x.discount.toLocaleString("id-ID"))+"\n";
  if(x.tax) s+=pad("PB1 "+t.tax+"%",x.tax.toLocaleString("id-ID"))+"\n";
  s+=pad("TOTAL",rp(x.total))+"\n"+pad(x.method,rp(x.paid))+"\n";
  if(x.change) s+=pad("Kembali",rp(x.change))+"\n";
  return s+`${"-".repeat(W)}\nTerima kasih, sampai jumpa lagi!`;
}

}
function signupModal(){ return `<h2>Daftarkan usaha baru</h2><p class="muted" style="font-size:.9rem">Usaha mendapat ruang data sendiri dan akun Pemilik Usaha.</p><form class="stack" data-form="signup">
  <div class="field"><label for="bn">Nama usaha</label><input class="input" id="bn" name="name" required placeholder="mis. Warung Makan Bu Tini"></div>
  <div class="row" style="flex-wrap:nowrap"><div class="field" style="flex:1"><label for="bt">Jenis</label><select class="input" id="bt" name="type"><option>F&amp;B</option><option>Minimarket</option><option>Retail</option><option>Jasa</option></select></div>
  <div class="field" style="flex:1"><label for="bc">Kota</label><input class="input" id="bc" name="city" required></div></div>
  <div class="field"><label for="on">Nama pemilik</label><input class="input" id="on" name="owner" required></div>
  <div class="field"><label for="oe">Email pemilik</label><input class="input" id="oe" name="email" type="email" required></div>
  <div class="field"><label for="bp">Paket</label><select class="input" id="bp" name="plan">${Object.entries(PLANS).map(([k,p])=>`<option value="${k}">${p.name} · ${rp(p.price)}/bln</option>`).join("")}</select></div>
  <div class="row"><button class="btn primary" type="submit">Daftar</button><button class="btn" type="button" data-a="close">Batal</button></div></form>`; }

/* ---------- events ---------- */
function openModal(fn){ ui.modal = typeof fn==="function"?fn:()=>fn; render(); const f=root.querySelector(".modal input,.modal button"); if(f) f.focus(); }
function closeModal(){ ui.modal=null; render(); }

root.addEventListener("click", e=>{
  const el = e.target.closest("[data-a]"); if(!el) return;
  const a=el.dataset.a, id=el.dataset.id, v=el.dataset.v;
  if(a==="scrim"){ if(e.target===el) closeModal(); return; }
  const u=me(), t=tenantOf(u);
  switch(a){
    case "login": ui.userId=id; ui.view=null; ui.cart=[]; ui.actingAs=null; render(); break;
    case "logout": ui.userId=null; ui.actingAs=null; ui.cart=[]; ui.modal=null; persistUi(); render(); break;
    case "reset": db=seed(); save(); toast("Data contoh dipulihkan"); render(); break;
    case "nav": ui.view=v; ui.modal=null; render(); window.scrollTo(0,0); break;
    case "cat": ui.cat=v; render(); break;
    case "add": { const p=db.products.find(p=>p.id===id); if(p.mods){ modPick=Object.fromEntries(p.mods.map(m=>[m.name,m.opts[0]])); openModal(modsModal(p)); break; } addToCart(p,null); render(); break; }
    case "inc": { const x=ui.cart.find(x=>x.key===id); if(x) addToCart(db.products.find(p=>p.id===x.pid), x.mods); render(); break; }
    case "dec": { const x=ui.cart.find(x=>x.key===id); if(x){ x.qty--; if(x.qty<=0) ui.cart=ui.cart.filter(y=>y!==x); } render(); break; }
    case "mod": modPick[el.dataset.g]=v; render(); break;
    case "modadd": { const p=db.products.find(p=>p.id===id); if(addToCart(p,{...modPick})) toast(p.name+" ditambahkan"); closeModal(); break; }
    case "otype": ui.order.type=v; render(); break;
    case "demoscan": scan(v); break;
    case "kstep": { const x=db.transactions.find(x=>x.id===id); x.kitchen = {baru:"proses",proses:"siap",siap:"selesai"}[x.kitchen]; save(); render(); if(x.kitchen==="selesai") toast("Pesanan "+(x.table?"meja "+x.table:x.id)+" diserahkan"); break; }
    case "clear": ui.cart=[]; ui.disc=0; render(); break;
    case "pay": if(isFnb(t) && ui.order.type==="Makan di sini" && !ui.order.table.trim()){ toast("Isi nomor meja dulu"); const el=root.querySelector("#tbl"); if(el) el.focus(); break; } pay={method:"Tunai",paid:0}; openModal(payModal); break;
    case "method": pay.method=v; render(); break;
    case "quick": pay.paid=+v; render(); break;
    case "confirm": {
      const c=cartCalc(t); const items=c.lines.map(l=>({pid:l.pid,name:l.name,qty:l.qty,price:l.unit,cost:l.cost,...(l.mods?{mods:l.mods}:{})}));
      const x=makeTrx(t,items,Math.min(Math.max(+ui.disc||0,0),100),pay.method,u.id,Date.now());
      x.paid = pay.method==="Tunai"?pay.paid:x.total; x.change = x.paid-x.total;
      for(const i of items){ const p=db.products.find(p=>p.id===i.pid); if(p.stock<999) p.stock-=i.qty; }
      if(isFnb(t)){ x.orderType=ui.order.type; if(x.orderType==="Makan di sini") x.table=ui.order.table.trim(); x.kitchen="baru"; }
      db.transactions.unshift(x); save(); ui.cart=[]; ui.disc=0; ui.order={type:ui.order.type,table:""}; openModal(receiptModal(x)); toast("Transaksi "+x.id+" tersimpan"); break; }
    case "close": closeModal(); break;
    case "viewtrx": openModal(receiptModal(db.transactions.find(x=>x.id===id))); break;
    case "copy": { const txt=receiptText(db.transactions.find(x=>x.id===id)); const done=()=>toast("Struk disalin"); try{ navigator.clipboard.writeText(txt).then(done,()=>selectReceipt()); }catch(err){ selectReceipt(); } break; }
    case "wa": { const n=root.querySelector("#wa").value.trim(); if(!/^0\d{8,13}$/.test(n.replace(/[\s-]/g,""))){ toast("Masukkan nomor WhatsApp yang dimulai 08"); break; } toast("Simulasi: struk dikirim ke "+n); break; }
    case "newprod": { const plan=PLANS[t.plan]; if(db.products.filter(p=>p.tenantId===t.id).length>=plan.products){ toast("Batas produk paket "+plan.name+" tercapai"); break; } openModal(prodModal(null)); break; }
    case "editprod": openModal(prodModal(db.products.find(p=>p.id===id))); break;
    case "delprod": { const p=db.products.find(p=>p.id===id); openModal(()=>`<h2>Hapus ${esc(p.name)}?</h2><p class="muted">Produk hilang dari kasir. Riwayat transaksi tetap tersimpan.</p><div class="row"><button class="btn primary" data-a="delprod-ok" data-id="${p.id}">Hapus</button><button class="btn" data-a="close">Batal</button></div>`); break; }
    case "delprod-ok": db.products=db.products.filter(p=>p.id!==id); ui.cart=ui.cart.filter(x=>x.pid!==id); save(); closeModal(); toast("Produk dihapus"); break;
    case "newstaff": { const plan=PLANS[t.plan]; const n=db.users.filter(x=>x.tenantId===t.id&&x.role!=="owner").length; if(n>=plan.staff){ toast("Batas "+plan.staff+" staf di paket "+plan.name+". Naikkan paket untuk menambah."); break; } openModal(staffModal); break; }
    case "delstaff": db.users=db.users.filter(x=>x.id!==id); save(); render(); toast("Staf dihapus"); break;
    case "setplan": t.plan=v; save(); render(); toast("Paket diganti ke "+PLANS[v].name); break;
    case "signup": openModal(signupModal); break;
    case "togglet": { const x=db.tenants.find(x=>x.id===id); x.status=x.status==="aktif"?"ditangguhkan":"aktif"; save(); render(); toast(x.name+" "+x.status); break; }
    case "impersonate": { const o=db.users.find(x=>x.tenantId===id&&x.role==="owner"); if(!o) break; ui.actingAs=ui.userId; ui.userId=o.id; ui.view=null; render(); toast("Masuk sebagai "+o.name); break; }
    case "unimpersonate": ui.userId=ui.actingAs; ui.actingAs=null; ui.view="tenants"; render(); break;
  }
});
function selectReceipt(){ const r=root.querySelector(".receipt"); if(!r) return; const s=getSelection(), rg=document.createRange(); rg.selectNodeContents(r); s.removeAllRanges(); s.addRange(rg); toast("Teks struk dipilih, tekan salin"); }

root.addEventListener("input", e=>{
  const a=e.target.dataset.a;
  if(a==="search"){ ui.q=e.target.value; const pos=e.target.selectionStart; render(); const s=root.querySelector("#pos-q"); s.focus(); s.setSelectionRange(pos,pos); }
  if(a==="table"){ ui.order.table=e.target.value; return; }
  if(a==="disc"){ ui.disc=e.target.value; render(); const d=root.querySelector("#disc"); d.focus(); const L=d.value.length; try{ d.setSelectionRange(L,L);}catch(_){} }
  if(a==="paid"){ pay.paid=+e.target.value||0; const t=tenantOf(me()), c=cartCalc(t), ch=pay.paid-c.total; root.querySelector("#chg").textContent = pay.paid?(ch>=0?rp(ch):"Uang kurang "+rp(-ch)):"–"; root.querySelector("#confirm-pay").disabled = ch<0; }
});
root.addEventListener("submit", e=>{
  e.preventDefault(); const f=e.target, d=Object.fromEntries(new FormData(f)); const u=me(), t=tenantOf(u);
  if(f.dataset.form==="prod"){
    const vals={name:d.name.trim(),cat:d.cat.trim(),price:+d.price,cost:+d.cost,stock:+d.stock};
    if(isRetail(t)){ vals.sku=(d.sku||"").trim()||undefined; vals.exp=d.exp?new Date(d.exp+"T12:00:00").getTime():undefined; vals.whole=(+d.wmin>1&&+d.wprice>0)?{min:+d.wmin,price:+d.wprice}:undefined;
      if(vals.sku && db.products.some(p=>p.tenantId===t.id&&p.sku===vals.sku&&p.id!==f.dataset.id)){ toast("Barcode sudah dipakai produk lain"); return; } }
    if(f.dataset.id) Object.assign(db.products.find(p=>p.id===f.dataset.id),vals); else db.products.push({id:uid("p"),tenantId:t.id,...vals});
    save(); closeModal(); toast("Produk disimpan");
  }
  if(f.dataset.form==="staff"){
    if(db.users.some(x=>x.email.toLowerCase()===d.email.toLowerCase())){ toast("Email sudah dipakai akun lain"); return; }
    db.users.push({id:uid("u"),name:d.name.trim(),email:d.email.trim(),role:d.role,tenantId:t.id}); save(); closeModal(); toast(d.name+" ditambahkan sebagai "+ROLE[d.role]);
  }
  if(f.dataset.form==="signup"){
    if(db.users.some(x=>x.email.toLowerCase()===d.email.toLowerCase())){ toast("Email sudah terdaftar"); return; }
    const tid=uid("t"); db.tenants.push({id:tid,name:d.name.trim(),type:d.type,plan:d.plan,status:"aktif",tax:d.type==="F&B"?10:0,joined:Date.now(),city:d.city.trim()});
    const oid=uid("u"); db.users.push({id:oid,name:d.owner.trim(),email:d.email.trim(),role:"owner",tenantId:tid});
    db.products.push({id:uid("p"),tenantId:tid,name:"Produk Contoh",cat:"Umum",price:10000,cost:6000,stock:50});
    save(); ui.modal=null;
    if(u && u.role==="superadmin"){ render(); toast(d.name+" terdaftar"); }
    else { ui.userId=oid; ui.view="dash"; render(); toast("Selamat datang, "+d.owner); }
  }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && ui.modal) closeModal(); if(e.key==="Enter" && e.target.id==="pos-q"){ e.preventDefault(); scan(e.target.value.trim()); } });
function scan(code){
  const t=tenantOf(me()); if(!code) return;
  const prods=db.products.filter(p=>p.tenantId===t.id);
  const p = prods.find(p=>p.sku===code) || prods.find(p=>p.name.toLowerCase()===code.toLowerCase()) || (()=>{ const m=prods.filter(p=>p.name.toLowerCase().includes(code.toLowerCase())); return m.length===1?m[0]:null; })();
  if(!p){ toast("Barcode "+code+" belum terdaftar"); return; }
  ui.q="";
  if(p.mods){ modPick=Object.fromEntries(p.mods.map(m=>[m.name,m.opts[0]])); openModal(modsModal(p)); return; }
  if(addToCart(p,null)) toast(p.name+" +1");
  render(); const s=root.querySelector("#pos-q"); if(s) s.focus();
}
render();
})();
</script>

</html>
