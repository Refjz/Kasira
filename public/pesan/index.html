<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<script src="../theme.js"></script>
<title>Pesan menu · Zidny POS</title>
<link rel="icon" type="image/png" href="../app/favicon-64.png">
<meta name="theme-color" content="#0C7A62">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Customer menu: one column on the phone, sticky categories, cart bar at the bottom, sheets for options and checkout. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E8EEEA; --ink:#14201B; --muted:#5B6A62; --line:#D6DED9;
  --accent:#0C7A62; --accent-ink:#FFFFFF; --accent-soft:#DCEFE8; --gold:#C98A0C; --gold-soft:#FBF0D6;
  --ok:#1C8A4B; --warn:#B7700A; --bad:#C2372F; --bad-soft:#F9E1DF;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1B; --surface-2:#1E2925; --ink:#E4ECE7; --muted:#93A39A; --line:#29362F;
  --accent:#38C29D; --accent-ink:#06261D; --accent-soft:#163A30; --gold:#EDB743; --gold-soft:#3A2F12;
  --ok:#4FCB83; --warn:#E9A93B; --bad:#F06A60; --bad-soft:#3C1C1A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1B; --surface-2:#1E2925; --ink:#E4ECE7; --muted:#93A39A; --line:#29362F;
  --accent:#38C29D; --accent-ink:#06261D; --accent-soft:#163A30; --gold:#EDB743; --gold-soft:#3A2F12;
  --ok:#4FCB83; --warn:#E9A93B; --bad:#F06A60; --bad-soft:#3C1C1A; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{background:var(--accent);color:var(--accent-ink);padding:calc(18px + env(safe-area-inset-top,0px)) 0 18px}
header h1{font-size:1.6rem;font-weight:800}
header .sub{opacity:.85;font-size:.9rem;margin-top:.2rem}
.chip{display:inline-block;margin-top:.6rem;background:rgba(255,255,255,.18);border-radius:99px;padding:.2rem .7rem;font-weight:700;font-size:.85rem}
.cats{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.cats .wrap{display:flex;gap:.4rem;overflow-x:auto;padding-top:.6rem;padding-bottom:.6rem;scrollbar-width:none}
.cats button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:.35rem .9rem;font-weight:600;white-space:nowrap}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.6rem .8rem;margin:.8rem 0 .2rem}
section h2{font-size:1.1rem;margin:1.1rem 0 .5rem}
.item{display:grid;grid-template-columns:1fr auto;gap:.6rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.8rem .9rem;margin-bottom:.55rem}
.item .nm{font-weight:600}
.item .pr{font-family:var(--f-mono);font-weight:700;font-size:.92rem}
.item .opt{font-size:.8rem;color:var(--muted)}
.item.out{opacity:.5}
.add{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;min-width:44px;height:40px;padding:0 .8rem;font-weight:700;font-size:1rem}
.add:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.qty button{border:0;background:none;width:38px;height:38px;font-weight:700;font-size:1.1rem}
.qty span{min-width:28px;text-align:center;font-family:var(--f-mono);font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.bar button{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:608px;margin:0 auto;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);padding:.95rem 1.1rem;font-weight:700;font-size:1.02rem;box-shadow:0 8px 24px rgba(2,42,33,.25)}
.btn{border:1px solid var(--line);background:var(--surface);padding:.7rem 1rem;border-radius:10px;font-weight:700;width:100%}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.scrim{position:fixed;inset:0;z-index:20;background:rgba(5,12,9,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:1.1rem 16px calc(1.1rem + env(safe-area-inset-bottom,0px));display:grid;gap:.9rem}
.spread{display:flex;justify-content:space-between;align-items:center;gap:.6rem}
.seg{display:flex;flex-wrap:wrap;gap:.4rem}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.5rem .85rem;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.field{display:grid;gap:.3rem}
.field label,.lbl{font-size:.85rem;font-weight:600}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.65rem .75rem}
.line{display:grid;grid-template-columns:1fr auto;gap:.2rem .6rem;padding:.6rem 0;border-bottom:1px dashed var(--line)}
.sum{display:grid;gap:.25rem;font-size:.95rem}
.sum div{display:flex;justify-content:space-between}
.sum .total{font-size:1.15rem;font-weight:700;border-top:1px solid var(--line);padding-top:.4rem}
.state{padding-top:2.5rem;padding-bottom:2.5rem;display:grid;gap:1rem;text-align:center;justify-items:center}
.big{font-family:var(--f-mono);font-size:2.6rem;font-weight:700;letter-spacing:.05em}
.pill{display:inline-block;padding:.2rem .7rem;border-radius:99px;font-weight:700;font-size:.85rem;background:var(--gold-soft);color:var(--gold)}
.pill.ok{background:var(--accent-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem;width:100%;text-align:left;display:grid;gap:.5rem}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:8px;font-weight:600;z-index:30;max-width:90vw}
footer{padding:1.5rem 0 7rem;text-align:center;font-size:.8rem}
footer a{color:inherit}
.dot{width:10px;height:10px;border-radius:50%;background:var(--gold);display:inline-block;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<div id="root"><div class="wrap state"><p class="muted">Memuat menu…</p></div></div>
<script type="module" src="pesan.js"></script>
</body>
</html>
