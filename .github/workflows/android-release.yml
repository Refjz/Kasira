# Builds the signed Android release (AAB for Play Console, APK for direct install).
# Run it from the Actions tab > "Build Android" > Run workflow, and enter a versionCode higher than the last upload.
# Needs repo secrets: UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_PASSWORD (optional UPLOAD_KEY_ALIAS).
name: Build Android

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (harus lebih besar dari upload terakhir di Play Console)"
        required: true
        type: number

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Salin tampilan aplikasi ke proyek Android
        run: |
          npm ci --no-audit --no-fund
          npm run android:sync

      - name: Pasang upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then echo "::error::Secret UPLOAD_KEYSTORE_BASE64 belum diisi"; exit 1; fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build AAB dan APK rilis
        working-directory: android
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Beri nama file
        run: |
          name="zidny-pos-$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)-vc${{ inputs.version_code }}"
          mkdir out
          cp android/app/build/outputs/bundle/release/app-release.aab "out/$name.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "out/$name.apk"
          echo "NAME=$name" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: out/
          retention-days: 30
